name: BuildSmart AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buildsmart
          POSTGRES_PASSWORD: buildsmart_dev_secret
          POSTGRES_DB: buildsmart_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run mypy Type Check
        run: mypy ml apps/api

      - name: Run Pytest Integration Suite
        env:
          DATABASE_URL: postgresql+asyncpg://buildsmart:buildsmart_dev_secret@localhost:5432/buildsmart_db
        run: pytest

      - name: Run pip-audit Security Scan
        run: |
          pip install pip-audit
          pip-audit --desc

  node-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./apps/web/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test -- --run

      - name: Run npm audit (High Severity)
        run: npm audit --audit-level=high

  gitleaks-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
