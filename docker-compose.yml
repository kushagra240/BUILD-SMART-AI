version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: buildsmart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildsmart_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-buildsmart_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildsmart} -d ${POSTGRES_DB:-buildsmart_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
